{% include 'cabecalho.html' %}

<h1 class="mb-4">Listagem de Cursos</h1>

<div class="row">

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome do Curso</th>
                <th>Duração</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>

            {% for item in lista %}
                <tr>
                    <td>{{ item[0] }}</td>
                    <td>{{ item[1] }}</td>
                    <td>{{ item[2] }}</td>
                    <td>
                        <a href="#" class="btn btn-primary btn-sm">Editar</a>
                        <a href="#" class="btn btn-danger btn-sm">Remover</a>
                    </td>
                </tr>
            {% endfor %}

        </tbody>
    </table>

</div>
