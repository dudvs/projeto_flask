{% include 'cabecalho.html' %}

<h1 class="mb-4">Lista de Alunos</h1>

<table class="table table-striped table-bordered">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
    </thead>

    <tbody>
        {% for aluno in lista_aluno %}
        <tr>
            <td>{{ aluno[0] }}</td>
            <td>{{ aluno[1] }}</td>
            <td>{{ aluno[2] }}</td>
            <td>{{ aluno[3] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
