{% include 'dashboard/cabecalho.html' %}

<!--inicio-->
<h1 class="mb-4">Listagem de Alunos</h1>

<div class = "row">

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            

        {% for aluno in lista_aluno%}
            <tr>
                <td>{{ aluno[0] }}</td>
                <td>{{ aluno[1] }}</td>
                <td>{{ aluno[2] }}</td>
                <td>{{ aluno[3] }}</td>
                <td>
                    <a href="/alunos/editar/{{item[0]}}" class="btn btn-primary btn-sm">Editar</a>
                    <a href="/alunos/remover/{{item[0]}}" class="btn btn-danger btn-sm"
                        onclick="return confirm('Tem certeza que deseja remover este registro?');">
                        Remover
                    </a>
                </td>
            </tr>

        {% endfor %}

        </tbody>
    </table>


</div>
